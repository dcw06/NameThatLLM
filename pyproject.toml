[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "name-that-llm"
version = "0.1.0"
description = "Reproducible, prompt-grouped authorship attribution for Kaggle Name That LLM"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scipy==1.16.2",
  "scikit-learn==1.7.2",
  "pyarrow==21.0.0",
  "joblib==1.5.2",
  "threadpoolctl==3.6.0",
  "packaging==26.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.13.3", "nbformat==5.10.4"]
neural = [
  "torch==2.8.0", "transformers==4.57.1", "accelerate==1.10.1",
  "peft==0.17.1", "huggingface-hub==0.35.3", "safetensors==0.6.2",
  "sentencepiece==0.2.1",
]
gpu = ["bitsandbytes==0.48.1; sys_platform == 'linux' and platform_machine == 'x86_64'"]
kaggle = ["kaggle>=1.7,<3"]

[project.scripts]
ntl = "ntl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ntl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
